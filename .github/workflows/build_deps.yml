on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      cache-path:
        required: true
        type: string
      valid-cache:
        required: true
        type: boolean
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
      build-deps-only:
        required: false
        type: boolean

jobs:
  build_deps:
    name: Build Deps
    if: inputs.build-deps-only || inputs.valid-cache != true
    # if: true
    runs-on: ${{ inputs.os == 'windows-latest' && 'windows-2022' || inputs.os }}
    env:
      date:
    steps:

      # Setup the environment
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: load cached deps
        uses: actions/cache@v4
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"  # use most recent 3.28.x version

      # Build Dependencies
      - name: Build on Windows
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: powershell
        run: |
            choco install strawberryperl
            $maxAttempts = 3
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              Write-Host "Dependency build attempt $attempt of $maxAttempts"
              .\test_build.bat deps
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq $maxAttempts) { exit $LASTEXITCODE }
              Write-Host "Dependency build failed, retrying in 20 seconds..."
              Start-Sleep -Seconds 20
            }
            .\test_build.bat pack
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cd ${{ github.workspace }}/deps/build

  build_creality_print:
    name: Build Creality Print
    needs: [build_deps]
    if: ${{ !cancelled() && !inputs.build-deps-only && (inputs.valid-cache == true && needs.build_deps.result == 'skipped') || (inputs.valid-cache != true && success()) }}
    uses: ./.github/workflows/build_creality_print.yml
    with:
      cache-key: ${{ inputs.cache-key }}
      cache-path: ${{ inputs.cache-path }}
      os: ${{ inputs.os }}
      arch: ${{ inputs.arch }}
    secrets: inherit
