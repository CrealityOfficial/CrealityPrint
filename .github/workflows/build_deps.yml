on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      cache-path:
        required: true
        type: string
      valid-cache:
        required: true
        type: boolean
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
      build-deps-only:
        required: false
        type: boolean

jobs:
  build_deps:
    name: Build Deps
    if: inputs.build-deps-only || inputs.valid-cache != true
    # if: true
    runs-on: ${{ inputs.os == 'windows-latest' && 'windows-2022' || inputs.os }}
    env:
      date:
    steps:

      # Setup the environment
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: load cached deps
        uses: actions/cache@v4
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"  # use most recent 3.28.x version

      # Build Dependencies
      - name: Build on Windows
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: powershell
        run: |
            choco install strawberryperl
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            # OpenSSL 1.1's Configure script requires Text::Template. The
            # current Strawberry Perl package on the runner does not include it.
            cpan -T Text::Template
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            # The 7.2.0 source references OpenCASCADE but this snapshot omitted
            # deps/OCCT. Restore the matching dependency definition from the
            # official CrealityPrint tree before building dependencies.
            New-Item -ItemType Directory -Force -Path "deps/OCCT" | Out-Null
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/CrealityOfficial/CrealityPrint/master/deps/OCCT/OCCT.cmake" -OutFile "deps/OCCT/OCCT.cmake"
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/CrealityOfficial/CrealityPrint/master/deps/OCCT/0001-OCCT-fix.patch" -OutFile "deps/OCCT/0001-OCCT-fix.patch"
            $depsCmake = Get-Content "deps/CMakeLists.txt" -Raw
            if ($depsCmake -notmatch 'include\(OCCT/OCCT\.cmake\)') {
              Add-Content "deps/CMakeLists.txt" "`ninclude(OCCT/OCCT.cmake)"
            }

            function Find-PahoMqttCppConfig {
              $root = Join-Path $env:GITHUB_WORKSPACE 'deps\build\OrcaSlicer_dep'
              if (-not (Test-Path $root)) { return $null }
              return Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -ieq 'PahoMqttCppConfig.cmake' -or $_.Name -ieq 'pahomqttcpp-config.cmake' } |
                Select-Object -First 1 -ExpandProperty FullName
            }

            function Test-RequiredDeps {
              $pahoC = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'deps\build\OrcaSlicer_dep') -Recurse -File `
                -Filter 'paho-mqtt3*-static.lib' -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
              $pahoCppConfig = Find-PahoMqttCppConfig
              $occtConfig = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'deps\build\OrcaSlicer_dep') -Recurse -File `
                -Filter 'OpenCASCADEConfig.cmake' -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName

              Write-Host "Dependency validation:"
              Write-Host "  Paho MQTT C library: $pahoC"
              Write-Host "  Paho MQTT C++ config: $pahoCppConfig"
              Write-Host "  OpenCASCADE config: $occtConfig"

              return ($pahoC -and $pahoCppConfig -and $occtConfig)
            }

            $maxAttempts = 3
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              Write-Host "Dependency build attempt $attempt of $maxAttempts"
              .\test_build.bat deps

              if (Test-RequiredDeps) { break }
              if ($attempt -eq $maxAttempts) {
                Write-Error "Full dependency build did not produce all required artifacts."
                exit 1
              }
              Write-Host "Dependency build incomplete, retrying in 20 seconds..."
              Start-Sleep -Seconds 20
            }

            # Paho MQTT has two external projects: dep_MQTTC is the C library,
            # while dep_MQTT is the C++ wrapper that installs PahoMqttCppConfig.cmake.
            # The slicer requires the C++ package config, so explicitly ensure it exists.
            if (-not (Find-PahoMqttCppConfig)) {
              Write-Host "Paho MQTT C++ package config is missing; building dep_MQTT explicitly."
              cmake --build "deps/build" --config Release --target dep_MQTT -- /m
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Explicit dep_MQTT build failed."
                exit $LASTEXITCODE
              }
            }

            if (-not (Test-RequiredDeps)) {
              Write-Error "Dependency validation failed after explicit dep_MQTT build."
              exit 1
            }

            .\test_build.bat pack
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cd ${{ github.workspace }}/deps/build

  build_creality_print:
    name: Build Creality Print
    needs: [build_deps]
    if: ${{ !cancelled() && !inputs.build-deps-only && (inputs.valid-cache == true && needs.build_deps.result == 'skipped') || (inputs.valid-cache != true && success()) }}
    uses: ./.github/workflows/build_creality_print.yml
    with:
      cache-key: ${{ inputs.cache-key }}
      cache-path: ${{ inputs.cache-path }}
      os: ${{ inputs.os }}
      arch: ${{ inputs.arch }}
    secrets: inherit
