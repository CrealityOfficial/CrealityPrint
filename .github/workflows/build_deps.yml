on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      cache-path:
        required: true
        type: string
      valid-cache:
        required: true
        type: boolean
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
      build-deps-only:
        required: false
        type: boolean

jobs:
  build_deps:
    name: Build Deps
    if: inputs.build-deps-only || inputs.valid-cache != true
    runs-on: ${{ inputs.os == 'windows-latest' && 'windows-2022' || inputs.os }}
    env:
      date:
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: load cached deps
        uses: actions/cache@v4
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Build on Windows
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: powershell
        run: |
            choco install strawberryperl
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            cpan -T Text::Template
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            New-Item -ItemType Directory -Force -Path "deps/OCCT" | Out-Null
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/CrealityOfficial/CrealityPrint/master/deps/OCCT/OCCT.cmake" -OutFile "deps/OCCT/OCCT.cmake"
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/CrealityOfficial/CrealityPrint/master/deps/OCCT/0001-OCCT-fix.patch" -OutFile "deps/OCCT/0001-OCCT-fix.patch"
            $depsCmake = Get-Content "deps/CMakeLists.txt" -Raw
            if ($depsCmake -notmatch 'include\(OCCT/OCCT\.cmake\)') {
              Add-Content "deps/CMakeLists.txt" "`ninclude(OCCT/OCCT.cmake)"
            }

            function Find-PahoMqttCppConfig {
              $root = Join-Path $env:GITHUB_WORKSPACE 'deps\build\OrcaSlicer_dep'
              if (-not (Test-Path $root)) { return $null }
              return Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -ieq 'PahoMqttCppConfig.cmake' -or $_.Name -ieq 'pahomqttcpp-config.cmake' } |
                Select-Object -First 1 -ExpandProperty FullName
            }

            function Test-CoreDeps {
              $root = Join-Path $env:GITHUB_WORKSPACE 'deps\build\OrcaSlicer_dep'
              $pahoC = Get-ChildItem -Path $root -Recurse -File -Filter 'paho-mqtt3*-static.lib' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
              $occtConfig = Get-ChildItem -Path $root -Recurse -File -Filter 'OpenCASCADEConfig.cmake' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
              $ffmpegHeader = Join-Path $root 'usr\local\include\libavutil\imgutils.h'
              $imatiHeader = Get-ChildItem -Path $root -Recurse -File -Filter 'imatistl.h' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName

              Write-Host "Core dependency validation:"
              Write-Host "  Paho MQTT C library: $pahoC"
              Write-Host "  OpenCASCADE config: $occtConfig"
              Write-Host "  FFmpeg imgutils header: $ffmpegHeader ($(Test-Path $ffmpegHeader))"
              Write-Host "  ImatiSTL header: $imatiHeader"
              return ($pahoC -and $occtConfig -and (Test-Path $ffmpegHeader) -and $imatiHeader)
            }

            $maxAttempts = 3
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              Write-Host "Dependency build attempt $attempt of $maxAttempts"
              .\test_build.bat deps

              if (Test-CoreDeps) { break }
              if ($attempt -eq $maxAttempts) {
                Write-Host "Normal dependency build is incomplete; explicitly building FFmpeg and ImatiSTL."
                cmake --build "deps/build" --config Release --target dep_FFmpeg dep_ImatiSTL -- /m
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                if (-not (Test-CoreDeps)) {
                  Write-Error "Dependency validation failed after explicit FFmpeg/ImatiSTL build."
                  exit 1
                }
                break
              }
              Write-Host "Core dependency build incomplete, retrying in 20 seconds..."
              Start-Sleep -Seconds 20
            }

            if (-not (Find-PahoMqttCppConfig)) {
              Write-Host "Paho MQTT C++ package config is missing; building dep_MQTT explicitly."
              cmake --build "deps/build" --config Release --target dep_MQTT -- /m
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Explicit dep_MQTT build failed."
                exit $LASTEXITCODE
              }
            }

            $pahoCppConfig = Find-PahoMqttCppConfig
            Write-Host "Paho MQTT C++ config after explicit build: $pahoCppConfig"
            if (-not $pahoCppConfig) {
              Write-Error "Dependency validation failed: dep_MQTT did not install PahoMqttCppConfig.cmake."
              exit 1
            }

            .\test_build.bat pack
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cd ${{ github.workspace }}/deps/build

  build_creality_print:
    name: Build Creality Print
    needs: [build_deps]
    if: ${{ !cancelled() && !inputs.build-deps-only && (inputs.valid-cache == true && needs.build_deps.result == 'skipped') || (inputs.valid-cache != true && success()) }}
    uses: ./.github/workflows/build_creality_print.yml
    with:
      cache-key: ${{ inputs.cache-key }}
      cache-path: ${{ inputs.cache-path }}
      os: ${{ inputs.os }}
      arch: ${{ inputs.arch }}
    secrets: inherit
